<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosmopolis</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <button class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="main-menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <ul id="main-menu">
        <li class="logo-item">
          <a href="/" class="logo-link">
            <img src="/assets/images/Logo_Kosmopolis_2019-removebg.png" alt="Logo Kosmopolis" class="logo-image">
          </a>
        </li>
        <li><a href="/">Accueil</a></li>
        <li><a href="/about">À propos</a></li>
        <li><a href="/medias">Médias</a></li>
        <li><a href="/agenda">Agenda</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    <h1 class="logo-title"><a href="/">KOS<span class="rainbow">MO</span>POLIS</a></h1>
    <p>Choeur de chambre mixte basé à Bruxelles.</p>
  </header>

  <main>
    <div class="card">
      <h2>Bienvenue au Choeur Kosmopolis !</h2>
      <img src="/assets/images/groupe.jpg" alt="Groupe" class="chorale-image">
      <p> Ensemble vocal Kosmopolite au coeur de Bruxelles ! :) </p>
      <a href="/agenda" class="btn">Voir nos événements</a>
    </div>
  </main>

  <footer>
    <p>© 2026 - Choeur Kosmopolis</p>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.hamburger');
      const menu = document.getElementById('main-menu');
      const menuLinks = menu ? menu.querySelectorAll('a') : [];
      
      function closeMenu() {
        if (hamburger) hamburger.setAttribute('aria-expanded', 'false');
        if (menu) menu.classList.remove('expanded');
      }
      
      if (hamburger && menu) {
        hamburger.addEventListener('click', function() {
          const isExpanded = this.getAttribute('aria-expanded') === 'true';
          this.setAttribute('aria-expanded', !isExpanded);
          menu.classList.toggle('expanded');
        });
        
        menuLinks.forEach(link => {
          link.addEventListener('click', function() {
            closeMenu();
          });
        });
      }
    });
  </script>
</body>
</html>
